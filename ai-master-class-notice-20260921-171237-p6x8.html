<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI大师课 · 培训通知</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0a0e1a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 600px;
    border-radius: 24px;
    overflow: hidden;
    position: relative;
    background: linear-gradient(155deg, #131a2e 0%, #0f1320 60%, #1a1033 100%);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(120,140,255,0.12);
  }

  /* 顶部光带 */
  .hero {
    position: relative;
    padding: 44px 40px 36px;
    background:
      radial-gradient(ellipse at 80% 0%, rgba(124,92,255,0.45) 0%, transparent 55%),
      radial-gradient(ellipse at 10% 10%, rgba(0,209,209,0.30) 0%, transparent 50%),
      linear-gradient(180deg, rgba(255,255,255,0.04), transparent);
    border-bottom: 1px solid rgba(124,140,255,0.18);
  }

  /* 身份标签 */
  .badges {
    display: flex;
    gap: 10px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }
  .badge {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    padding: 6px 14px;
    border-radius: 999px;
  }
  .badge-num {
    background: linear-gradient(90deg, #00d1d1, #7c5cff);
    color: #0a0e1a;
  }
  .badge-ghost {
    border: 1px solid rgba(0,209,209,0.5);
    color: #7feaea;
    background: rgba(0,209,209,0.06);
  }

  .title-main {
    font-size: 46px;
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: 1px;
    background: linear-gradient(90deg, #ffffff 0%, #9fb4ff 60%, #7feaea 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .title-sub {
    margin-top: 14px;
    font-size: 17px;
    font-weight: 500;
    color: #b8c2e6;
    letter-spacing: 2px;
  }

  /* 装饰星点 */
  .spark {
    position: absolute;
    width: 4px; height: 4px;
    background: #7feaea;
    border-radius: 50%;
    box-shadow: 0 0 8px #7feaea;
    opacity: 0.7;
  }
  .s1 { top: 30px; right: 60px; }
  .s2 { top: 70px; right: 110px; width:3px; height:3px; background:#b69cff; box-shadow:0 0 8px #b69cff;}
  .s3 { bottom: 40px; right: 40px; width:5px; height:5px;}

  /* 讲师卡 */
  .speaker {
    margin: 0 40px;
    margin-top: -8px;
    padding: 18px 22px;
    border-radius: 16px;
    background: rgba(124,92,255,0.10);
    border: 1px solid rgba(124,140,255,0.25);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .speaker-icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: linear-gradient(135deg, #00d1d1, #7c5cff);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .speaker-text .label {
    font-size: 11px;
    color: #7feaea;
    letter-spacing: 2px;
    font-weight: 700;
  }
  .speaker-text .name {
    font-size: 18px;
    font-weight: 700;
    color: #ffffff;
    margin-top: 3px;
  }
  .speaker-text .from {
    font-size: 13px;
    color: #9aa6cf;
    margin-top: 2px;
  }

  /* 信息行 */
  .info {
    padding: 30px 40px 8px;
  }
  .info-row {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 14px 0;
    border-bottom: 1px dashed rgba(124,140,255,0.15);
  }
  .info-row:last-child { border-bottom: none; }
  .info-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: rgba(0,209,209,0.10);
    border: 1px solid rgba(0,209,209,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 17px;
    flex-shrink: 0;
  }
  .info-content .k {
    font-size: 12px;
    color: #6f7da8;
    letter-spacing: 1.5px;
    font-weight: 600;
  }
  .info-content .v {
    font-size: 16px;
    color: #e8edff;
    font-weight: 500;
    margin-top: 2px;
  }
  .placeholder {
    color: #5d6789 !important;
    font-style: italic;
    font-weight: 400;
  }

  /* 底部 */
  .footer {
    margin: 8px 40px 0;
    padding: 22px 0 30px;
    border-top: 1px solid rgba(124,140,255,0.15);
    text-align: center;
  }
  .cta {
    display: inline-block;
    padding: 14px 40px;
    border-radius: 999px;
    background: linear-gradient(90deg, #00d1d1, #7c5cff);
    color: #0a0e1a;
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 16px;
  }
  .note {
    font-size: 12px;
    color: #6f7da8;
    line-height: 1.7;
  }
  .note strong { color: #ff7e9e; }

  .id-strip {
    background: linear-gradient(90deg, rgba(0,209,209,0.12), rgba(124,92,255,0.12));
    padding: 10px;
    text-align: center;
    font-size: 11px;
    letter-spacing: 3px;
    color: #7feaea;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="card">
    <!-- HERO -->
    <div class="hero">
      <span class="spark s1"></span>
      <span class="spark s2"></span>
      <span class="spark s3"></span>

      <div class="badges">
        <span class="badge badge-num">① 号场</span>
        <span class="badge badge-ghost">MASTER CLASS</span>
        <span class="badge badge-ghost">总部特邀</span>
      </div>

      <div class="title-main">AI 大师课</div>
      <div class="title-sub">A I · M A S T E R · C L A S S</div>
    </div>

    <!-- 讲师 -->
    <div class="speaker">
      <div class="speaker-icon">🧠</div>
      <div class="speaker-text">
        <div class="label">特邀主讲</div>
        <div class="name">待定</div>
        <div class="from">公司总部 · AI领域资深专家</div>
      </div>
    </div>

    <!-- 信息 -->
    <div class="info">
      <div class="info-row">
        <div class="info-icon">📌</div>
        <div class="info-content">
          <div class="k">培训主题</div>
          <div class="v placeholder">待定（总部AI老师拟定）</div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon">⏰</div>
        <div class="info-content">
          <div class="k">时间</div>
          <div class="v placeholder">待定 · 精确到分钟</div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon">📍</div>
        <div class="info-content">
          <div class="k">地点 / 形式</div>
          <div class="v placeholder">待定（线上会议 / 线下会议室）</div>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon">👥</div>
        <div class="info-content">
          <div class="k">参训对象</div>
          <div class="v placeholder">待定</div>
        </div>
      </div>
    </div>

    <!-- 底部 -->
    <div class="footer">
      <div class="cta">别走错场，认准 ① 号</div>
      <div class="note">
        本场为 <strong>「AI 大师课」① 号场</strong>，与同期待定 ② 号培训<br>
        主题 / 时间 / 颜色均不同，请留意区分，别整混啦 ✦
      </div>
    </div>

    <div class="id-strip">— A I  ·  M A S T E R  ·  C L A S S  ·  ① —</div>
  </div>
</body>
</html>
